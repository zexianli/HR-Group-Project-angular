<div
  *ngIf="isLoading"
  style="
    width: 100vw;
    height: calc(100% - 53px);
    display: flex;
    justify-content: center;
    align-items: center;
  ">
  <mat-spinner></mat-spinner>
</div>

<main [style.display]="isLoading ? 'none' : 'flex'">
  <!-- Total count -->
  <div id="employee-count">
    Employee Count
    <p style="text-align: center; font-weight: 900; font-size: 50px">
      {{ totalCount }}
    </p>
  </div>
  <!-- Employee summary -->
  <div id="employee-summary">
    <!-- Search bar -->
    <div class="employee-summary-content-container" id="search-container">
      <mat-form-field
        appearance="outline"
        style="width: 50%; min-width: 100px; margin: 22px">
        <mat-label>Search</mat-label>
        <input
          matInput
          placeholder="Type the first name, last name, or the preferred name"
          (keyup)="applyFilter($event)" />
      </mat-form-field>
    </div>
    <!-- Employee Table (with pagination, decide) -->

    <div
      class="employee-summary-content-container"
      id="employees-list-container">
      <table mat-table [dataSource]="dataSource">
        <!-- Position Column -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let element">
            <span
              class="name"
              click="$event.preventDefault(); handleElementClick()">
              {{ element.name }}
            </span>
          </td>
        </ng-container>

        <!-- Name Column -->
        <ng-container matColumnDef="ssn">
          <th mat-header-cell *matHeaderCellDef>SSN</th>
          <td mat-cell *matCellDef="let element">{{ element.ssn }}</td>
        </ng-container>

        <!-- Weight Column -->
        <ng-container matColumnDef="workAuthorizationTitle">
          <th mat-header-cell *matHeaderCellDef>Work Authorization</th>
          <td mat-cell *matCellDef="let element">
            {{ element.workAuthorizationTitle }}
          </td>
        </ng-container>

        <!-- Symbol Column -->
        <ng-container matColumnDef="phone">
          <th mat-header-cell *matHeaderCellDef>Phone Number</th>
          <td mat-cell *matCellDef="let element">{{ element.phone }}</td>
        </ng-container>

        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>Email</th>
          <td mat-cell *matCellDef="let element">{{ element.email }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
      <mat-paginator
        #paginator
        style="position: absolute; bottom: 0; right: 0"
        [pageSizeOptions]="[1, 5, 10]"
        showFirstLastButtons
        aria-label="Select page of employee(s)">
      </mat-paginator>
    </div>
  </div>
</main>
